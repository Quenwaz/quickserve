name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: go build -o quickserve ./cmd/quickserve

      - name: Smoke test
        run: |
          ./quickserve -v
          ./quickserve -h
          ./quickserve -x && exit 1 || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true          # 载入本地 docker daemon，供后续 docker run 冒烟
          tags: quickserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -e
          # 预创建挂载目录并授予容器内 UID 65532 写权限（Linux 上 bind mount
          # 保留宿主属主，Docker Desktop 会自动处理但 CI runner 不会）
          mkdir -p smoke-data
          sudo chown 65532:65532 smoke-data
          docker run -d --name qs -p 8000:8000 \
            --read-only --cap-drop ALL \
            -v "$PWD/smoke-data:/data" quickserve:ci

          # 任何一步失败都先倾倒容器日志再退出，便于定位
          trap 'echo "=== container logs ==="; docker logs qs; docker rm -f qs || true' EXIT

          # 轮询等待就绪，替代固定 sleep
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q ok

          echo "test" > /tmp/f.txt
          curl -fsS -T /tmp/f.txt http://localhost:8000/f.txt
          curl -fsS http://localhost:8000/f.txt | grep -q test
          grep -q test smoke-data/f.txt

          docker rm -f qs
          trap - EXIT
