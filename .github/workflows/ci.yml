name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: go build -o quickserve ./cmd/quickserve

      - name: Smoke test
        run: |
          ./quickserve -v
          ./quickserve -h
          ./quickserve -x && exit 1 || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: quickserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --rm --name qs -p 8000:8000 \
            --read-only --cap-drop ALL \
            -v "$PWD/smoke-data:/data" quickserve:ci
          sleep 2
          curl -fsS http://localhost:8000/health
          echo "test" > /tmp/f.txt
          curl -fsS -T /tmp/f.txt http://localhost:8000/f.txt
          curl -fsS http://localhost:8000/f.txt | grep -q test
          docker stop qs
